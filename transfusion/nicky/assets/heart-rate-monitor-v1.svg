<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-label="Wall-mounted heart-rate monitor angled toward the nurse with a moving green heartbeat trace">
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfdfe"/>
      <stop offset="1" stop-color="#c8d8df"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8da0a9"/>
      <stop offset="1" stop-color="#536b76"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#09252f"/>
      <stop offset="1" stop-color="#031115"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-70%" width="140%" height="240%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screenClip">
      <path d="M45 68Q39 68 39 75L39 190Q39 198 46 199L284 214Q294 215 294 204L294 60Q294 51 285 52Z"/>
    </clipPath>
  </defs>

  <g fill="none" stroke="#728791" stroke-linecap="round" stroke-linejoin="round">
    <path d="M350 100h43V68h31" stroke-width="16"/>
    <path d="M394 69v103" stroke-width="11"/>
    <circle cx="394" cy="101" r="13" fill="#9babb2" stroke-width="6"/>
  </g>

  <!-- The right edge is deliberately taller, creating perspective toward the nurse. -->
  <path d="M310 34L350 51Q357 54 357 63L357 229Q357 238 350 242L310 263Z" fill="url(#side)" stroke="#526b76" stroke-width="7" stroke-linejoin="round"/>
  <path d="M35 53Q22 54 22 68L22 224Q22 238 35 239L305 264Q319 265 319 250L319 48Q319 33 305 35Z" fill="url(#case)" stroke="#7b919b" stroke-width="8" stroke-linejoin="round"/>
  <path d="M45 68Q39 68 39 75L39 190Q39 198 46 199L284 214Q294 215 294 204L294 60Q294 51 285 52Z" fill="url(#screen)" stroke="#36515b" stroke-width="5" stroke-linejoin="round"/>

  <!-- Keep the heartbeat confined to the black monitor screen.
     The matrix also gives it the same perspective/skew as the screen. -->
<g clip-path="url(#screenClip)"
   filter="url(#glow)"
   transform="matrix(1 .025 0 1 0 0)">

  <!-- The ECG begins as a flat baseline.
       Around the centre of the screen it makes a small rise,
       a small dip, a large upward spike, a downward spike,
       then returns to the baseline.

       pathLength="100" gives us a convenient 0–100 scale for
       animating how much of the line has been drawn. -->
  <path d="
      M45 139
      H120
      L128 134
      L136 139
      H143
      L149 150
      L158 100
      L168 163
      L178 139
      H190
      L198 132
      L208 139
      H302"
      pathLength="100"
      fill="none"
      stroke="#43f2a4"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-dasharray="100"
      stroke-dashoffset="100">

    <!-- Instead of translating the whole ECG,
         reduce the hidden portion of the stroke.
         This makes the trace DRAW ITSELF from left to right.

         100 = completely hidden.
         0   = completely visible.

         At the end of 2.2 seconds it resets and begins again. -->
    <animate attributeName="stroke-dashoffset"
             from="100"
             to="0"
             dur="1s"
             repeatCount="indefinite"/>
  </path>
</g>

  <!-- Patient name and heart-rate reading remain on the white panel. -->
  <g transform="matrix(1 .085 0 1 0 -4)" font-family="Arial, sans-serif" font-weight="700">
    <text x="48" y="224" font-size="18" fill="#244653">NICKY</text>
    <circle cx="221" cy="215" r="7" fill="#43c6e5"/>
    <circle cx="243" cy="215" r="7" fill="#ffc83d"/>
    <text x="261" y="222" font-size="21" fill="#159866">98</text>
    <text x="285" y="222" font-size="10" fill="#50707c">BPM</text>
  </g>

  <path d="M337 232c-4 22-21 28-18 56" fill="none" stroke="#526b76" stroke-width="6" stroke-linecap="round"/>
  <circle cx="320" cy="286" r="7" fill="#d3e0e5" stroke="#526b76" stroke-width="4"/>
</svg>

