<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-label="Wall-mounted heart-rate monitor angled toward the nurse with a moving green heartbeat trace">
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbfd"/>
      <stop offset="1" stop-color="#c8d8df"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8197a1"/>
      <stop offset="1" stop-color="#526b76"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#09252f"/>
      <stop offset="1" stop-color="#031115"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-70%" width="140%" height="240%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screenClip">
      <polygon points="50,65 304,79 304,190 50,205"/>
    </clipPath>
  </defs>

  <g fill="none" stroke="#728791" stroke-linecap="round" stroke-linejoin="round">
    <path d="M347 101h46V68h31" stroke-width="16"/>
    <path d="M394 69v103" stroke-width="11"/>
    <circle cx="394" cy="101" r="13" fill="#9babb2" stroke-width="6"/>
  </g>

  <polygon points="319,52 358,69 358,221 319,240" fill="url(#side)" stroke="#526b76" stroke-width="7"/>
  <polygon points="22,34 319,52 319,240 22,263" fill="url(#case)" stroke="#7b919b" stroke-width="8" stroke-linejoin="round"/>
  <polygon points="50,65 304,79 304,190 50,205" fill="url(#screen)" stroke="#36515b" stroke-width="5" stroke-linejoin="round"/>

  <g clip-path="url(#screenClip)" opacity=".18" stroke="#78d9c8" stroke-width="1">
    <path d="M48 93l258 13M48 123l258 8M48 153l258 3M48 183l258-2"/>
    <path d="M93 63v140M144 67v133M195 70v127M246 74v120"/>
  </g>

  <g clip-path="url(#screenClip)" filter="url(#glow)">
    <g class="ecg-scroll" transform="matrix(1 .05 0 1 0 0)">
      <path d="M-160 128h30l8-6 8 6h22l9-18 11 43 13-78 15 53h34l8-6 8 6h22l9-18 11 43 13-78 15 53h34l8-6 8 6h22l9-18 11 43 13-78 15 53h34l8-6 8 6h22l9-18 11 43 13-78 15 53h34l8-6 8 6h22l9-18 11 43 13-78 15 53h45" fill="none" stroke="#43f2a4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g transform="matrix(1 .05 0 1 0 0)" font-family="Arial, sans-serif" font-weight="700">
    <text x="49" y="230" font-size="18" fill="#244653">NICKY</text>
    <circle cx="222" cy="221" r="7" fill="#43c6e5"/>
    <circle cx="244" cy="222" r="7" fill="#ffc83d"/>
    <text x="263" y="230" font-size="21" fill="#159866">98</text>
    <text x="295" y="231" font-size="10" fill="#50707c">BPM</text>
  </g>

  <path d="M337 226c-4 25-22 31-19 62" fill="none" stroke="#526b76" stroke-width="6" stroke-linecap="round"/>
  <circle cx="319" cy="286" r="7" fill="#d3e0e5" stroke="#526b76" stroke-width="4"/>

  <style>
    .ecg-scroll {
      animation: ecg-scroll 1.65s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes ecg-scroll {
      from { translate: 0 0; }
      to { translate: -150px 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ecg-scroll { animation: none; }
    }
  </style>
</svg>
